<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Větrný park Anenská Studánka – VR (klasická verze)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Montserrat',system-ui,sans-serif;background:#efeae2;color:#222}
    #landing{position:fixed;inset:0;z-index:9999;background:#efeae2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;transition:opacity .4s}
    #landing.hidden{opacity:0;pointer-events:none}
    .logos{display:flex;align-items:center;justify-content:center;gap:48px;margin-bottom:36px;flex-wrap:wrap}
    .logos img{height:96px;width:auto;object-fit:contain}
    .logos .noho{height:64px}
    h1{font-size:clamp(2.2rem,4.6vw,3.6rem);font-weight:800;letter-spacing:.01em;margin-bottom:6px;text-align:center;color:#0a2540}
    .badge{display:inline-block;background:#0a2540;color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.1em;padding:4px 10px;border-radius:20px;margin-bottom:18px;text-transform:uppercase}
    .subtitle{color:#777;font-size:1rem;margin-bottom:48px;text-align:center;font-weight:400}
    .buttons{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
    .view-btn{padding:22px 56px;font-size:1.25rem;border:none;border-radius:60px;cursor:pointer;color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.05em;transition:transform .15s,box-shadow .15s;font-family:inherit;background:linear-gradient(135deg,#1d5fbf,#2a9d4a);box-shadow:0 6px 24px rgba(29,95,191,.35)}
    .view-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(29,95,191,.45)}
    .hint{margin-top:32px;color:#888;font-size:.85rem;text-align:center;max-width:480px;line-height:1.5}
    .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:.8rem;color:#888;text-decoration:none}
    .nav:hover{color:#0a2540}
    #loading-overlay{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;color:#fff;font-size:1.2rem}
    #loading-overlay.visible{display:flex}
    .spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.15);border-top-color:#f2c849;border-radius:50%;animation:spin .7s linear infinite;margin-right:14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .a-enter-vr{display:none!important}
  </style>
</head>
<body>

<div id="landing">
  <div class="logos">
    <img class="noho" src="../assets/noho-logo.svg" alt="NOHO" onerror="this.style.display='none'">
    <img src="../assets/as-znak.png" alt="Anenská Studánka" onerror="this.style.display='none'">
  </div>
  <h1>Větrný park Anenská Studánka – VR</h1>
  <span class="badge">Klasická verze · A-Frame</span>
  <p class="subtitle">Vizualizace větrného parku – tři lokace</p>
  <div class="buttons">
    <button class="view-btn" data-img="img-1">Lokace 1</button>
    <button class="view-btn" data-img="img-2">Lokace 2</button>
    <button class="view-btn" data-img="img-3">Lokace 3</button>
  </div>
  <p class="hint">Funguje i bez headsetu – na počítači se rozhlížejte tažením myší. Na Questu doporučujeme výchozí verzi s WebXR Layers.</p>
  <a class="nav" href="../">← výchozí verze (WebXR Layers)</a>
</div>

<div id="loading-overlay"><div class="spinner"></div><span>Načítání…</span></div>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<a-scene vr-mode-ui="enabled:false" renderer="colorManagement:true;antialias:true" loading-screen="enabled:false" webxr="requiredFeatures:local-floor">
  <a-assets timeout="120000">
    <img id="img-1" src="../assets/lokace-1.jpg" crossorigin="anonymous">
    <img id="img-2" src="../assets/lokace-2.jpg" crossorigin="anonymous">
    <img id="img-3" src="../assets/lokace-3.jpg" crossorigin="anonymous">
  </a-assets>
  <a-sky id="sky" visible="false" material="shader:flat;side:back"></a-sky>
  <a-entity id="rig" position="0 1.6 0">
    <a-camera look-controls="pointerLockEnabled:false" wasd-controls="enabled:false"></a-camera>
  </a-entity>
</a-scene>

<script>
(function(){
  'use strict';
  var landing = document.getElementById('landing');
  var loading = document.getElementById('loading-overlay');
  var scene   = document.querySelector('a-scene');
  var sky     = document.getElementById('sky');

  document.querySelectorAll('.view-btn').forEach(function(btn){
    btn.addEventListener('click', async function(){
      loading.classList.add('visible');
      if(!scene.hasLoaded) await new Promise(function(r){ scene.addEventListener('loaded', r, { once:true }) });
      sky.setAttribute('material', 'src', '#' + btn.dataset.img);
      try{ await scene.enterVR() }catch(e){ console.warn('VR fallback (2D režim):', e) }
      sky.object3D.visible = true;
      landing.classList.add('hidden');
      loading.classList.remove('visible');
    });
  });

  scene.addEventListener('exit-vr', function(){
    sky.object3D.visible = false;
    landing.classList.remove('hidden');
  });

  // 2D (no headset): Esc returns to the menu
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && landing.classList.contains('hidden') && !scene.is('vr-mode')){
      sky.object3D.visible = false;
      landing.classList.remove('hidden');
    }
  });
})();
</script>
</body>
</html>
